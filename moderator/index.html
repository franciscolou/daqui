<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Moderação | Daqui</title>
    <!-- Config por ambiente (gitignored) — copie config.example.js para
         public/config.js e ajuste API_URL/APP_URL. Sem esse arquivo, o painel
         cai nos defaults de localhost (nada quebra se ele não existir). -->
    <script src="/config.js"></script>
    <script>
      // Aplica o tema antes do primeiro paint (evita o flash do tema errado).
      (function () {
        try {
          var stored = localStorage.getItem('daqui-moderator-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
