services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daqui
      POSTGRES_PASSWORD: daqui
      POSTGRES_DB: daqui
    ports:
      - "5432:5432"
    volumes:
      - daqui-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daqui"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  daqui-db-data:
